services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: retailcore
      POSTGRES_PASSWORD: retailcore
      POSTGRES_DB: retailcore
    ports:
      - "5432:5432"
    volumes:
      - retailcore-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U retailcore -d retailcore"]
      interval: 5s
      timeout: 3s
      retries: 10
  retailcore:
    build: .
    ports:
      - "8080:8080"
    environment:
      RETAILCORE_RUNTIME_MODE: postgres
      DB_URL: jdbc:postgresql://postgres:5432/retailcore
      DB_USER: retailcore
      DB_PASSWORD: retailcore
    depends_on:
      postgres:
        condition: service_healthy
volumes:
  retailcore-pgdata:
