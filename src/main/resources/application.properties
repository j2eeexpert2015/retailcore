# Change this one value: h2 (no Docker) or postgres (Docker PostgreSQL).
retailcore.runtime-mode=${RETAILCORE_RUNTIME_MODE:h2}
spring.profiles.active=${retailcore.runtime-mode}
server.port=8080
payments.currency=USD
spring.jpa.properties.hibernate.globally_quoted_identifiers=true
spring.jpa.open-in-view=false
