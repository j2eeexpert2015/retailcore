<!DOCTYPE html><html xmlns:th="http://www.thymeleaf.org"><head><meta charset="UTF-8"><title>RetailCore — Recent orders</title><style>body{font-family:sans-serif;margin:2rem}table{border-collapse:collapse;width:100%}td,th{padding:.7rem;border-bottom:1px solid #ddd;text-align:left}</style></head><body><h1>RetailCore — Recent Orders</h1><table><thead><tr><th>ID</th><th>Reference</th><th>Customer</th><th>Status</th><th>Total</th><th>Created</th></tr></thead><tbody><tr th:each="order : ${orders}"><td th:text="${order.id}"></td><td th:text="${order.reference}"></td><td th:text="${order.customerEmail}"></td><td th:text="${order.status}"></td><td th:text="${order.total}"></td><td th:text="${order.createdAtUtc}"></td></tr></tbody></table></body></html>
